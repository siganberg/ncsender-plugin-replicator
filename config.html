<script>
(function() {
  var FALLBACK_PORT = __SERVER_PORT__;
  var initialConfig = __INITIAL_CONFIG__;

  var resolveApiBaseUrl = function() {
    if (window.ncSender && typeof window.ncSender.getApiBaseUrl === 'function') {
      return window.ncSender.getApiBaseUrl(FALLBACK_PORT);
    }
    return '';
  };

  var BASE_URL = resolveApiBaseUrl();

  // ---- G-code analysis (moved from index.js) ----

  function calculateArcBounds(centerX, centerY, radius, startAngle, endAngle, isClockwise) {
    var normalize = function(angle) {
      while (angle < 0) angle += 2 * Math.PI;
      while (angle >= 2 * Math.PI) angle -= 2 * Math.PI;
      return angle;
    };

    var start = normalize(startAngle);
    var end = normalize(endAngle);

    var isAngleInArc = function(angle) {
      var a = normalize(angle);
      if (isClockwise) {
        if (start >= end) {
          return a <= start && a >= end;
        } else {
          return a <= start || a >= end;
        }
      } else {
        if (start <= end) {
          return a >= start && a <= end;
        } else {
          return a >= start || a <= end;
        }
      }
    };

    var sX = centerX + radius * Math.cos(startAngle);
    var sY = centerY + radius * Math.sin(startAngle);
    var eX = centerX + radius * Math.cos(endAngle);
    var eY = centerY + radius * Math.sin(endAngle);

    var minX = Math.min(sX, eX);
    var maxX = Math.max(sX, eX);
    var minY = Math.min(sY, eY);
    var maxY = Math.max(sY, eY);

    if (isAngleInArc(0)) maxX = centerX + radius;
    if (isAngleInArc(Math.PI / 2)) maxY = centerY + radius;
    if (isAngleInArc(Math.PI)) minX = centerX - radius;
    if (isAngleInArc(3 * Math.PI / 2)) minY = centerY - radius;

    return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
  }

  /**
   * Whether the program is written in inches.
   *
   * Everything this plugin measures and places is in millimetres, but a G20
   * file's coordinates are inches. Without this, an offset worked out in mm was
   * written into the file as inches: a 0.125" gap became 3.175 inches, and a
   * 20 mm circle a 20-inch one.
   */
  function detectFileInches(gcodeContent) {
    var lines = gcodeContent.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].replace(/\([^)]*\)/g, '').replace(/;.*/, '').toUpperCase();
      if (/\bG20\b/.test(t)) return true;
      if (/\bG21\b/.test(t)) return false;
    }
    return false;
  }

  function analyzeGCodeBounds(gcodeContent) {
    var bounds = {
      min: { x: Infinity, y: Infinity, z: Infinity },
      max: { x: -Infinity, y: -Infinity, z: -Infinity }
    };

    var currentX = 0, currentY = 0, currentZ = 0;
    var isAbsolute = true;
    var isArcAbsolute = false;
    var motionMode = 0;

    var lines = gcodeContent.split('\n');

    for (var li = 0; li < lines.length; li++) {
      var trimmed = lines[li].trim().toUpperCase();

      if (trimmed.charAt(0) === '(' || trimmed.charAt(0) === ';' || trimmed.charAt(0) === '%') {
        continue;
      }

      if (trimmed.indexOf('G90.1') !== -1) isArcAbsolute = true;
      if (trimmed.indexOf('G91.1') !== -1) isArcAbsolute = false;
      if (trimmed.indexOf('G90') !== -1 && trimmed.indexOf('G90.1') === -1) isAbsolute = true;
      if (trimmed.indexOf('G91') !== -1 && trimmed.indexOf('G91.1') === -1) isAbsolute = false;

      if (trimmed.indexOf('G53') !== -1) continue;

      if (/\bG0*0\b/.test(trimmed)) motionMode = 0;
      if (/\bG0*1\b/.test(trimmed)) motionMode = 1;
      if (/\bG0*2\b/.test(trimmed)) motionMode = 2;
      if (/\bG0*3\b/.test(trimmed)) motionMode = 3;

      var xMatch = trimmed.match(/X([+-]?\d*\.?\d+)/);
      var yMatch = trimmed.match(/Y([+-]?\d*\.?\d+)/);
      var zMatch = trimmed.match(/Z([+-]?\d*\.?\d+)/);
      var iMatch = trimmed.match(/I([+-]?\d*\.?\d+)/);
      var jMatch = trimmed.match(/J([+-]?\d*\.?\d+)/);

      var startX = currentX;
      var startY = currentY;

      var endX = currentX;
      var endY = currentY;
      var endZ = currentZ;

      if (xMatch) {
        var val = parseFloat(xMatch[1]);
        endX = isAbsolute ? val : currentX + val;
      }
      if (yMatch) {
        var val = parseFloat(yMatch[1]);
        endY = isAbsolute ? val : currentY + val;
      }
      if (zMatch) {
        var val = parseFloat(zMatch[1]);
        endZ = isAbsolute ? val : currentZ + val;
      }

      var isArc = (motionMode === 2 || motionMode === 3) && (iMatch || jMatch);

      if (isArc) {
        var i = iMatch ? parseFloat(iMatch[1]) : 0;
        var j = jMatch ? parseFloat(jMatch[1]) : 0;

        var centerX, centerY;
        if (isArcAbsolute) {
          centerX = i;
          centerY = j;
        } else {
          centerX = startX + i;
          centerY = startY + j;
        }

        var radius = Math.sqrt(Math.pow(startX - centerX, 2) + Math.pow(startY - centerY, 2));
        var arcStartAngle = Math.atan2(startY - centerY, startX - centerX);
        var arcEndAngle = Math.atan2(endY - centerY, endX - centerX);
        var isG2 = motionMode === 2;

        var arcBounds = calculateArcBounds(centerX, centerY, radius, arcStartAngle, arcEndAngle, isG2);

        bounds.min.x = Math.min(bounds.min.x, arcBounds.minX);
        bounds.min.y = Math.min(bounds.min.y, arcBounds.minY);
        bounds.max.x = Math.max(bounds.max.x, arcBounds.maxX);
        bounds.max.y = Math.max(bounds.max.y, arcBounds.maxY);
      }

      currentX = endX;
      currentY = endY;
      currentZ = endZ;

      if (motionMode >= 1) {
        if (xMatch) {
          bounds.min.x = Math.min(bounds.min.x, currentX);
          bounds.max.x = Math.max(bounds.max.x, currentX);
        }
        if (yMatch) {
          bounds.min.y = Math.min(bounds.min.y, currentY);
          bounds.max.y = Math.max(bounds.max.y, currentY);
        }
        if (zMatch) {
          bounds.min.z = Math.min(bounds.min.z, currentZ);
          bounds.max.z = Math.max(bounds.max.z, currentZ);
        }
      }
    }

    if (bounds.min.x === Infinity) bounds.min.x = 0;
    if (bounds.min.y === Infinity) bounds.min.y = 0;
    if (bounds.min.z === Infinity) bounds.min.z = 0;
    if (bounds.max.x === -Infinity) bounds.max.x = 0;
    if (bounds.max.y === -Infinity) bounds.max.y = 0;
    if (bounds.max.z === -Infinity) bounds.max.z = 0;

    return bounds;
  }

    // ---- Skip instances parsing & validation ----

    function parseSkipInstances(input, maxParts) {
      var skipSet = new Set();
      if (!input || !input.trim()) return skipSet;

      var parts = input.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
      for (var pi = 0; pi < parts.length; pi++) {
        var part = parts[pi];
        if (part.indexOf('-') !== -1) {
          var range = part.split('-').map(function(s) { return s.trim(); });
          var start = parseInt(range[0], 10);
          var end = parseInt(range[1], 10);
          if (!isNaN(start) && !isNaN(end) && start > 0 && end >= start) {
            for (var i = start; i <= Math.min(end, maxParts); i++) {
              skipSet.add(i);
            }
          }
        } else {
          var num = parseInt(part, 10);
          if (!isNaN(num) && num > 0 && num <= maxParts) {
            skipSet.add(num);
          }
        }
      }
      return skipSet;
    }

    function validateSkipInstances(input, maxParts) {
      if (!input || !input.trim()) return null;

      var parts = input.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
      for (var pi = 0; pi < parts.length; pi++) {
        var part = parts[pi];
        if (part.indexOf('-') !== -1) {
          var rangeParts = part.split('-');
          if (rangeParts.length !== 2) {
            return 'Invalid range format: ' + part;
          }
          var startStr = rangeParts[0].trim();
          var endStr = rangeParts[1].trim();
          if (!startStr || !endStr) {
            return 'Invalid range: ' + part;
          }
          var start = parseInt(startStr, 10);
          var end = parseInt(endStr, 10);
          if (isNaN(start) || isNaN(end)) {
            return 'Invalid numbers in range: ' + part;
          }
          if (start < 1) {
            return 'Range start must be >= 1: ' + part;
          }
          if (end < start) {
            return 'Range end must be >= start: ' + part;
          }
          if (start > maxParts) {
            return 'Range start exceeds total parts (' + maxParts + '): ' + part;
          }
        } else {
          var num = parseInt(part, 10);
          if (isNaN(num)) {
            return 'Invalid number: ' + part;
          }
          if (num < 1) {
            return 'Instance must be >= 1: ' + part;
          }
          if (num > maxParts) {
            return 'Instance exceeds total parts (' + maxParts + '): ' + part;
          }
        }
      }
      return null;
    }

    function getOutputFilename() {
      var rows = parseInt(document.getElementById('rows').value) || 1;
      var columns = parseInt(document.getElementById('columns').value) || 1;
      var baseName = originalSourceFile.replace(/\.[^.]+$/, '');
      return baseName + '_' + rows + 'x' + columns + '.nc';
    }

    /** Which tab is showing, and everything that tab's fields say. */
    function activePattern() {

      return (btn && btn.getAttribute('data-nav')) || 'grid';

    function numValue(id, fallback) {
      var el = document.getElementById(id);
      if (!el) return fallback;
      var v = parseFloat(el.value);
      return isFinite(v) ? v : fallback;

    function readPatternInputs() {
      var tab = activePattern();

      if (tab === 'circular') {
        var style = (document.getElementById('circStyle') || {}).value || 'circular';
        var count = Math.max(1, Math.round(numValue('circCount', 1)));
        return {
          tab: tab,

          label: (style === 'circular-follow' ? 'Circular, path direction' : 'Circular') +
                 ' - ' + count + ' around ' + numValue('circRadius', 0) + distanceUnit,
          count: count,
          radius: convertToMetric(numValue('circRadius', 0)),
          startAngle: numValue('circStartAngle', 0)
        };
      }

      var isHoney = tab === 'honeycomb';
      var rows = Math.max(1, Math.round(numValue(isHoney ? 'hcRows' : 'rows', 1)));
      var columns = Math.max(1, Math.round(numValue(isHoney ? 'hcColumns' : 'columns', 1)));
      var modeEl = document.getElementById(isHoney ? 'hcSpacingMode' : 'spacingMode');
      var byDistance = !!(modeEl && modeEl.dataset.value === 'distance');
      var xMm = convertToMetric(numValue(isHoney ? 'hcGapX' : 'gapX', 0));
      var yMm = convertToMetric(numValue(isHoney ? 'hcGapY' : 'gapY', 0));
      var trimEl = document.getElementById('trimEnds');

      return {
        tab: tab,
        style: isHoney ? 'honeycomb' : 'linear',
        label: (isHoney ? 'Honeycomb' : 'Grid') + ' - ' + columns + ' x ' + rows,
        rows: rows,
        columns: columns,
        // Distance is the step itself; a gap is added to the part it follows.
        spacingX: byDistance ? xMm : partWidth + xMm,
        spacingY: byDistance ? yMm : partHeight + yMm,
        rowDirection: (document.getElementById('rowDirection') || {}).dataset ?
          document.getElementById('rowDirection').dataset.value : 'positive',
        columnDirection: (document.getElementById('columnDirection') || {}).dataset ?
          document.getElementById('columnDirection').dataset.value : 'positive',
        trimEnds: isHoney && trimEl ? trimEl.checked : false
      };
    }

    function updatePreview() {
      var patternInputs = readPatternInputs();
      var skipInput = document.getElementById('skipInstances').value || '';
      var extent = computePatternExtent(patternInputs, partWidth, partHeight);
      var totalParts = extent.count;

      // Validate skip instances
      var skipError = validateSkipInstances(skipInput, totalParts);
      var skipInputEl = document.getElementById('skipInstances');
      var skipErrorEl = document.getElementById('skipInstances-error');
      var skipFormGroup = skipInputEl.closest('.form-group');

      if (skipError) {
        skipInputEl.classList.add('input-error');
        if (skipFormGroup) skipFormGroup.classList.add('has-error');
        if (skipErrorEl) skipErrorEl.textContent = skipError;
      } else {
        skipInputEl.classList.remove('input-error');
        if (skipFormGroup) skipFormGroup.classList.remove('has-error');
        if (skipErrorEl) skipErrorEl.textContent = '';
      }

      var skipSet = skipError ? new Set() : parseSkipInstances(skipInput, totalParts);
      var generatingCount = totalParts - skipSet.size;

      var gridWidthMm = extent.width;
      var gridHeightMm = extent.height;

      var skippedRow = document.getElementById('skippedRow');
      if (skipSet.size > 0 && !skipError) {
        document.getElementById('totalParts').textContent = generatingCount + ' of ' + totalParts;
        skippedRow.style.display = '';
        document.getElementById('generatingParts').textContent = Array.from(skipSet).sort(function(a, b) { return a - b; }).join(', ');
      } else {
        document.getElementById('totalParts').textContent = totalParts;
        skippedRow.style.display = 'none';
      }
      document.getElementById('gridSize').textContent =
        convertToDisplay(gridWidthMm).toFixed(1) + ' x ' +
        convertToDisplay(gridHeightMm).toFixed(1) + ' ' + distanceUnit;

      var validationMsg = document.getElementById('validationMessage');
      var generateBtn = document.getElementById('generateBtn');

      if (skipError) {
        validationMsg.classList.remove('show');
        generateBtn.disabled = true;
      } else if (gridWidthMm > machineLimits.x || gridHeightMm > machineLimits.y) {
        validationMsg.textContent = 'Grid size exceeds machine limits! ' +
          'Grid: ' + convertToDisplay(gridWidthMm).toFixed(1) + ' x ' + convertToDisplay(gridHeightMm).toFixed(1) + ' ' + distanceUnit + ', ' +
          'Machine: ' + convertToDisplay(machineLimits.x).toFixed(0) + ' x ' + convertToDisplay(machineLimits.y).toFixed(0) + ' ' + distanceUnit;
        validationMsg.classList.add('show');
        generateBtn.disabled = true;
      } else if ((patternInputs.spacingX != null && patternInputs.spacingX < partWidth) ||
                 (patternInputs.spacingY != null && patternInputs.spacingY < partHeight)) {
        validationMsg.textContent = 'Warning: Negative gap will cause parts to overlap.';
        validationMsg.classList.add('show');
        generateBtn.disabled = false;
      } else {
        validationMsg.classList.remove('show');
        generateBtn.disabled = false;
      }
    }

    // ---- Pattern geometry ----

    /**
     * Where each copy goes: an offset from the original part, plus a rotation.
     *
     * Mirrors QuickCut's patterns so the two plugins mean the same thing by
     * Honeycomb and the two Circular styles:
     *  - honeycomb inserts a shifted row between each pair of primary rows, so
     *    "3 rows" means 3 primary rows with alternates filling in between;
     *    trimEnds drops one item from the shifted rows so the ends line up.
     *  - circular spaces copies evenly around a circle; 'circular-follow' also
     *    turns each one to face outward, the only style that needs rotation.
     */
    function computePatternPositions(opts) {
      var positions = [];
      var style = opts.style;

      if (style === 'circular' || style === 'circular-follow') {
        var count = Math.max(1, Math.floor(opts.count || 1));
        var step = 360 / count;
        var follow = style === 'circular-follow';
        for (var k = 0; k < count; k++) {
          var deg = (opts.startAngle || 0) + step * k;
          var rad = deg * Math.PI / 180;
          positions.push({
            offsetX: (opts.radius || 0) * Math.cos(rad),
            offsetY: (opts.radius || 0) * Math.sin(rad),
            rotDeg: follow ? deg : 0,
            row: 1,
            col: k + 1
          });
        }
        return positions;
      }

      var rows = Math.max(1, Math.floor(opts.rows || 1));
      var columns = Math.max(1, Math.floor(opts.columns || 1));
      var sx = opts.spacingX * (opts.columnDirection === 'positive' ? 1 : -1);
      var sy = opts.spacingY * (opts.rowDirection === 'positive' ? 1 : -1);

      if (style === 'honeycomb') {
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < columns; c++) {
            positions.push({ offsetX: c * sx, offsetY: r * sy, rotDeg: 0, row: r + 1, col: c + 1 });
          }
          if (r < rows - 1) {
            var shifted = opts.trimEnds ? Math.max(0, columns - 1) : columns;
            for (var h = 0; h < shifted; h++) {
              positions.push({
                offsetX: h * sx + sx / 2,
                offsetY: r * sy + sy / 2,
                rotDeg: 0,
                row: r + 1,
                col: h + 1
              });
            }
          }
        }
        return positions;
      }

      for (var rr = 0; rr < rows; rr++) {
        for (var cc = 0; cc < columns; cc++) {
          positions.push({ offsetX: cc * sx, offsetY: rr * sy, rotDeg: 0, row: rr + 1, col: cc + 1 });
        }
      }
      return positions;
    }

    /** The footprint of the whole pattern, for the summary and the limit check. */
    function computePatternExtent(opts, partWidth, partHeight) {
      var positions = computePatternPositions(opts);
      if (positions.length === 0) return { width: 0, height: 0, count: 0 };
      var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (var i = 0; i < positions.length; i++) {
        var pos = positions[i];
        // A part turned to face the circle sweeps its diagonal, so its
        // footprint is taken from that rather than from its width.
        var span = Math.sqrt(partWidth * partWidth + partHeight * partHeight);
        var w = pos.rotDeg ? span : partWidth;
        var h = pos.rotDeg ? span : partHeight;
        if (pos.offsetX < minX) minX = pos.offsetX;
        if (pos.offsetX + w > maxX) maxX = pos.offsetX + w;
        if (pos.offsetY < minY) minY = pos.offsetY;
        if (pos.offsetY + h > maxY) maxY = pos.offsetY + h;
      }
      return { width: maxX - minX, height: maxY - minY, count: positions.length };
    }

    // ---- G-code generation functions ----

    // Carried across lines so a rotated move that names only one axis can still
    // be written out with both.
    var lastX = 0;
    var lastY = 0;

    /** Chord tolerance for arcs that must be written as straight moves, in mm. */
    var arcToleranceMm = 0.002;

    /**
     * Per-instance transform: turn about the part's own origin, then shift.
     *
     * Rotation is only ever non-zero for Circular (Path Direction). XY arcs stay
     * arcs: their I/J centre offsets turn as a vector, and G2/G3 is unchanged
     * because a turn about Z keeps the sense of the arc.
     *
     * An XZ or YZ arc (G18/G19) turned by an arbitrary angle lies in a slanted
     * plane that no G-code plane word can name, so it is written out as straight
     * G1 moves instead. The machine cannot tell: grblHAL never cuts a true arc,
     * it splits every G2/G3 into segments using its own arc tolerance ($12,
     * 0.002 mm by default), and this uses the same figure and the same formula.
     */
    function createOffsetFn(offsetX, offsetY, rotationDeg) {
      var isAbsolute = true;
      // Offsets arrive in mm; the lines being moved are in the file's units.
      if (fileInches) {
        offsetX = offsetX / 25.4;
        offsetY = offsetY / 25.4;
      }
      lastX = 0;
      lastY = 0;
      var lastZ = 0;
      var inches = fileInches;
      var rot = rotationDeg || 0;
      var rad = rot * Math.PI / 180;
      var cos = Math.cos(rad);
      var sin = Math.sin(rad);
      var plane = 'G17';
      var motion = null;
      // The motion mode the controller is really in. Once an arc has gone out
      // as G1 moves it differs from the file's, so a later line that leans on
      // the modal mode has to say it out loud.
      var sentMotion = null;

      function fmt(v) { return v.toFixed(inches ? 4 : 3); }

      function place(x, y) {
        return { x: x * cos - y * sin + offsetX, y: x * sin + y * cos + offsetY };
      }

      var AXES = { G17: ['x', 'y', 'z'], G18: ['z', 'x', 'y'], G19: ['y', 'z', 'x'] };

      function linearize(line, trimmed, planeWordText, start, end) {
        var ax = AXES[plane];
        var a = ax[0], b = ax[1], h = ax[2];
        var cw = motion === 2;
        var centre = { x: start.x, y: start.y, z: start.z };
        var iM = line.match(/I([+-]?\d*\.?\d+)/i);
        var jM = line.match(/J([+-]?\d*\.?\d+)/i);
        var kM = line.match(/K([+-]?\d*\.?\d+)/i);
        var rM = line.match(/R([+-]?\d*\.?\d+)/i);

        if (iM || jM || kM) {
          centre.x += iM ? parseFloat(iM[1]) : 0;
          centre.y += jM ? parseFloat(jM[1]) : 0;
          centre.z += kM ? parseFloat(kM[1]) : 0;
        } else if (rM) {
          var rSigned = parseFloat(rM[1]);
          var da = end[a] - start[a], db = end[b] - start[b];
          var chord = Math.sqrt(da * da + db * db);
          if (chord < 1e-9) return null;
          var rr = Math.abs(rSigned);
          var hh = Math.sqrt(Math.max(0, rr * rr - (chord / 2) * (chord / 2)));
          // Short arc (R > 0) or long arc (R < 0), on the side the direction implies.
          var side = (cw !== (rSigned < 0)) ? -1 : 1;
          centre[a] = (start[a] + end[a]) / 2 + side * hh * (-db / chord);
          centre[b] = (start[b] + end[b]) / 2 + side * hh * (da / chord);
        } else {
          return null;
        }

        var radius = Math.sqrt(Math.pow(start[a] - centre[a], 2) + Math.pow(start[b] - centre[b], 2));
        var sa = Math.atan2(start[b] - centre[b], start[a] - centre[a]);
        var ea = Math.atan2(end[b] - centre[b], end[a] - centre[a]);
        var sweep = ea - sa;
        // Same rule grblHAL applies: a clockwise arc always travels negative.
        if (cw) { if (sweep >= -1e-9) sweep -= 2 * Math.PI; }
        else { if (sweep <= 1e-9) sweep += 2 * Math.PI; }

        var tol = inches ? arcToleranceMm / 25.4 : arcToleranceMm;
        var segLen = radius > tol ? 2 * Math.sqrt(tol * (2 * radius - tol)) : Math.max(radius, tol);
        var count = Math.max(1, Math.ceil(Math.abs(sweep) * radius / segLen));

        var fM = line.match(/F([+-]?\d*\.?\d+)/i);
        var indent = (line.match(/^\s*/) || [''])[0];
        var out = [];
        for (var n = 1; n <= count; n++) {
          var pt;
          if (n === count) {
            pt = { x: end.x, y: end.y, z: end.z };
          } else {
            var t = n / count;
            var ang = sa + sweep * t;
            pt = {};
            pt[a] = centre[a] + radius * Math.cos(ang);
            pt[b] = centre[b] + radius * Math.sin(ang);
            pt[h] = start[h] + (end[h] - start[h]) * t;
          }
          var q = place(pt.x, pt.y);
          var words = 'G1 X' + fmt(q.x) + ' Y' + fmt(q.y) + ' Z' + fmt(pt.z);
          // The plane word is kept so the controller's plane is what the file
          // expects afterwards, and the feed rides on the first move.
          if (n === 1) words = (planeWordText ? planeWordText + ' ' : '') + words + (fM ? ' F' + fM[1] : '');
          out.push(indent + words);
        }
        sentMotion = 1;
        return out.join('\n');
      }

      return function(line) {
        var trimmed = line.trim().toUpperCase();

        if (trimmed.charAt(0) === '(' || trimmed.charAt(0) === ';' || trimmed === '' || trimmed.indexOf('G53') !== -1) {
          return line;
        }

        if (trimmed.indexOf('G90') !== -1 && trimmed.indexOf('G90.1') === -1) isAbsolute = true;
        if (trimmed.indexOf('G91') !== -1 && trimmed.indexOf('G91.1') === -1) isAbsolute = false;
        if (/\bG20\b/.test(trimmed)) inches = true;
        if (/\bG21\b/.test(trimmed)) inches = false;

        var planeWord = trimmed.match(/\bG1([789])\b/);
        if (planeWord) plane = 'G1' + planeWord[1];
        var motionWord = trimmed.match(/\bG0*([0123])\b/);
        if (motionWord) motion = Number(motionWord[1]);

        // ---- Plain shift: byte-for-byte what this did before rotation existed ----
        if (!rot) {
          if (trimmed.indexOf('X') === -1 && trimmed.indexOf('Y') === -1) {
            return line;
          }
          if (!isAbsolute) {
            return line;
          }
          // Three decimals of a millimetre, four of an inch.
          var places = fileInches ? 4 : 3;
          var shifted = line.replace(/X([+-]?\d*\.?\d+)/gi, function(match, value) {
            return 'X' + (parseFloat(value) + offsetX).toFixed(places);
          });
          return shifted.replace(/Y([+-]?\d*\.?\d+)/gi, function(match, value) {
            return 'Y' + (parseFloat(value) + offsetY).toFixed(places);
          });
        }

        // ---- Turned copy ----
        if (!isAbsolute) {
          return line;
        }

        var xMatch = line.match(/X([+-]?\d*\.?\d+)/i);
        var yMatch = line.match(/Y([+-]?\d*\.?\d+)/i);
        var zMatch = line.match(/Z([+-]?\d*\.?\d+)/i);
        var start = { x: lastX, y: lastY, z: lastZ };
        var end = {
          x: xMatch ? parseFloat(xMatch[1]) : lastX,
          y: yMatch ? parseFloat(yMatch[1]) : lastY,
          z: zMatch ? parseFloat(zMatch[1]) : lastZ
        };
        lastX = end.x;
        lastY = end.y;
        lastZ = end.z;

        var isArc = motion === 2 || motion === 3;
        if (isArc && plane !== 'G17' && (xMatch || yMatch || zMatch)) {
          var segments = linearize(line, trimmed, planeWord ? planeWord[0] : '', start, end);
          if (segments !== null) return segments;
        }

        var result = line;

        if (xMatch || yMatch) {
          var q = place(end.x, end.y);
          if (xMatch && yMatch) {
            result = result.replace(/X([+-]?\d*\.?\d+)/i, 'X' + fmt(q.x)).replace(/Y([+-]?\d*\.?\d+)/i, 'Y' + fmt(q.y));
          } else if (xMatch) {
            // A turned move that named one axis now moves in both.
            result = result.replace(/X([+-]?\d*\.?\d+)/i, 'X' + fmt(q.x) + ' Y' + fmt(q.y));
          } else {
            result = result.replace(/Y([+-]?\d*\.?\d+)/i, 'X' + fmt(q.x) + ' Y' + fmt(q.y));
          }
        }

        if (isArc && plane === 'G17') {
          var iM = line.match(/I([+-]?\d*\.?\d+)/i);
          var jM = line.match(/J([+-]?\d*\.?\d+)/i);
          if (iM || jM) {
            var i0 = iM ? parseFloat(iM[1]) : 0;
            var j0 = jM ? parseFloat(jM[1]) : 0;
            var ri = i0 * cos - j0 * sin;
            var rj = i0 * sin + j0 * cos;
            result = result.replace(/\s*I[+-]?\d*\.?\d+/i, '').replace(/\s*J[+-]?\d*\.?\d+/i, '');
            var anchor = result.match(/Y[+-]?\d*\.?\d+/i) || result.match(/X[+-]?\d*\.?\d+/i);
            var ij = ' I' + fmt(ri) + ' J' + fmt(rj);
            result = anchor ? result.replace(anchor[0], anchor[0] + ij) : result.replace(/\s*$/, ij);
          }
        }

        // A modal line after arc moves went out as G1 would otherwise run in G1.
        var moves = xMatch || yMatch || zMatch || /[IJKR][+-]?\d/i.test(trimmed);
        if (!motionWord && motion !== null && motion !== sentMotion && moves) {
          var ind = (result.match(/^\s*/) || [''])[0];
          result = ind + 'G' + motion + ' ' + result.trim();
        }
        if (motion !== null && (motionWord || moves)) sentMotion = motion;

        return result;
      };
    }

    function isGcodeComment(command) {
      var trimmed = command.trim();
      var withoutLineNumber = trimmed.replace(/^N\d+\s*/i, '');
      if (withoutLineNumber.charAt(0) === ';') return true;
      if (withoutLineNumber.charAt(0) === '(' && withoutLineNumber.charAt(withoutLineNumber.length - 1) === ')') return true;
      return false;
    }

    var SPINDLE_STOP_PATTERN = /(?:^|[^A-Z0-9])M0*5(?:[^0-9]|$)/i;
    function isSpindleStopCommand(command) {
      if (!command || typeof command !== 'string') return false;
      if (isGcodeComment(command)) return false;
      return SPINDLE_STOP_PATTERN.test(command.trim().toUpperCase());
    }

    function isOperationNameComment(line) {
      var trimmed = line.trim();
      if (trimmed.charAt(0) !== '(' || trimmed.charAt(trimmed.length - 1) !== ')') return false;
      if (trimmed.length > 50) return false;
      var content = trimmed.slice(1, -1).trim();
      if (content.length < 2) return false;
      if (content.indexOf(':') !== -1 || content.indexOf('=') !== -1) return false;
      if (/^[A-Za-z0-9_ -]+$/.test(content) && content.length < 30) return true;
      return false;
    }

    function isOperationStart(line) {
      var trimmed = line.trim().toUpperCase();
      if (/\bM0*[34]\b/.test(trimmed)) return true;
      if (/\bG0*[01]\b/.test(trimmed) && /[XY][+-]?\d/.test(trimmed) && trimmed.indexOf('G53') === -1) return true;
      return false;
    }

    function processLinesWithCommentRepositioning(lines, applyOffsetFn, skipSpindleStop, output) {
      var pendingComment = null;
      var afterG53 = false;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var trimmed = line.trim().toUpperCase();

        if (trimmed.indexOf('G53') !== -1) {
          afterG53 = true;
        }

        if (skipSpindleStop && isSpindleStopCommand(line)) {
          continue;
        }

        if (isOperationNameComment(line)) {
          if (afterG53) {
            pendingComment = line;
            continue;
          }
        }

        if (pendingComment && isOperationStart(line)) {
          output.push(pendingComment);
          pendingComment = null;
          afterG53 = false;
        }

        output.push(applyOffsetFn(line));

        if (trimmed.charAt(0) !== '(' && trimmed.charAt(0) !== ';' && trimmed !== '') {
          if (trimmed.indexOf('G53') === -1) {
            afterG53 = false;
          }
        }
      }
    }

    function parseToolSegments(gcode) {
      var lines = gcode.split('\n');
      var segments = [];
      var currentSegment = { toolNum: null, lines: [], isHeader: true };

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var trimmed = line.trim().toUpperCase();

        if (trimmed === 'M30' || trimmed === 'M2') continue;

        var m6Match = trimmed.match(/M6\s*T(\d+)|T(\d+)\s*M6/i);
        var tMatch = trimmed.match(/^T(\d+)$/i);

        if (m6Match || tMatch) {
          if (currentSegment.lines.length > 0) {
            segments.push(currentSegment);
          }

          var toolNum = m6Match ? (m6Match[1] || m6Match[2]) : tMatch[1];
          currentSegment = { toolNum: parseInt(toolNum), lines: [], isHeader: false };
        } else {
          currentSegment.lines.push(line);
        }
      }

      if (currentSegment.lines.length > 0) {
        segments.push(currentSegment);
      }

      return segments;
    }

    function generateReplicatedGCode(originalGcode, options) {
      var rows = options.rows;
      var columns = options.columns;
      var rowDirection = options.rowDirection;
      var columnDirection = options.columnDirection;
      var spacingX = options.spacingX;
      var spacingY = options.spacingY;
      var gapX = options.gapX;
      var gapY = options.gapY;
      var sortByTool = options.sortByTool;
      var skipInstances = options.skipInstances;
      var origFilename = options.originalFilename;

      var xMultiplier = columnDirection === 'positive' ? 1 : -1;
      var yMultiplier = rowDirection === 'positive' ? 1 : -1;
      var totalParts = options.totalParts;

      var output = [];

      var skipSet = parseSkipInstances(skipInstances, totalParts);

      output.push('(Replicated G-code generated by Replicator Plugin)');
      output.push('(Source: ' + origFilename + ')');
      output.push('(Pattern: ' + options.patternLabel + ' - ' + totalParts + ' parts)');
      if (skipSet.size > 0) {
        output.push('(Skipped instances: ' + Array.from(skipSet).sort(function(a, b) { return a - b; }).join(', ') + ')');
        output.push('(Generating: ' + (totalParts - skipSet.size) + ' parts)');
      }
      output.push('(Gap: X=' + gapX.toFixed(3) + 'mm, Y=' + gapY.toFixed(3) + 'mm)');
      output.push('(X Direction: ' + columnDirection + ', Y Direction: ' + rowDirection + ')');
      output.push('(Sort by Tool: ' + (sortByTool ? 'Yes' : 'No') + ')');
      output.push('');

      var allPositions = computePatternPositions({
        style: options.patternStyle,
        rows: rows,
        columns: columns,
        spacingX: spacingX,
        spacingY: spacingY,
        rowDirection: rowDirection,
        columnDirection: columnDirection,
        trimEnds: options.trimEnds,
        count: options.count,
        radius: options.radius,
        startAngle: options.startAngle
      });

      var positions = [];
      for (var pi = 0; pi < allPositions.length; pi++) {
        var partNum = pi + 1;
        if (skipSet.has(partNum)) continue;
        var placed = allPositions[pi];
        placed.partNum = partNum;
        positions.push(placed);
      }

      if (sortByTool) {
        var segments = parseToolSegments(originalGcode);
        var headerSegment = segments.find(function(s) { return s.isHeader; });
        var toolSegments = segments.filter(function(s) { return !s.isHeader; });

        if (toolSegments.length === 0) {
          output.push('(No tool changes detected, using standard replication)');
          output.push('');

          var sourceLines = headerSegment ? headerSegment.lines : originalGcode.split('\n');
          var preamble = [];
          var cutting = [];
          var postamble = [];
          var phase = 'preamble';

          for (var li = 0; li < sourceLines.length; li++) {
            var line = sourceLines[li];
            var trimmed = line.trim().toUpperCase();

            if (/\bM0*30\b/.test(trimmed) || /\bM0*2\b/.test(trimmed)) continue;

            if (phase === 'preamble') {
              var isSpindleStart = /\bM0*[34]\b/.test(trimmed);
              var hasXY = /[XY][+-]?\d/.test(trimmed) && !/G53/.test(trimmed);
              if (isSpindleStart || hasXY) {
                phase = 'cutting';
              }
            }

            if (phase === 'cutting') {
              var isG53 = /G53/.test(trimmed);
              var isStop = isSpindleStopCommand(line);
              if (isG53 || isStop) {
                phase = 'postamble';
              }
            }

            if (phase === 'preamble') {
              preamble.push(line);
            } else if (phase === 'cutting') {
              cutting.push(line);
            } else {
              postamble.push(line);
            }
          }

          for (var i = 0; i < preamble.length; i++) {
            output.push(preamble[i]);
          }
          output.push('');

          for (var posIndex = 0; posIndex < positions.length; posIndex++) {
            var pos = positions[posIndex];
            var isLast = posIndex === positions.length - 1;

            output.push('(Part ' + pos.partNum + ' of ' + totalParts + ' - Row ' + pos.row + ', Col ' + pos.col + ')');
            output.push('(Offset: X=' + pos.offsetX.toFixed(3) + ', Y=' + pos.offsetY.toFixed(3) + ')');

            processLinesWithCommentRepositioning(
              cutting,
              createOffsetFn(pos.offsetX, pos.offsetY, pos.rotDeg),
              !isLast,
              output
            );
            output.push('');
          }

          for (var i = 0; i < postamble.length; i++) {
            output.push(postamble[i]);
          }
        } else {
          var toolGroups = {};
          var toolOrder = [];
          for (var si = 0; si < toolSegments.length; si++) {
            var seg = toolSegments[si];
            if (!toolGroups[seg.toolNum]) {
              toolGroups[seg.toolNum] = [];
              toolOrder.push(seg.toolNum);
            }
            toolGroups[seg.toolNum].push(seg);
          }

          output.push('(Tool order optimized to minimize tool changes)');
          output.push('(Unique tools: ' + toolOrder.map(function(t) { return 'T' + t; }).join(', ') + ')');
          output.push('(Total tool changes: ' + toolOrder.length + ', reduced from ' + (toolSegments.length * totalParts) + ')');
          output.push('');

          for (var ti = 0; ti < toolOrder.length; ti++) {
            var toolNum = toolOrder[ti];
            var segsForTool = toolGroups[toolNum];

            output.push('(Tool T' + toolNum + ' - All Parts)');
            output.push('M6 T' + toolNum);
            output.push('');

            var allLinesForTool = [];
            for (var si = 0; si < segsForTool.length; si++) {
              allLinesForTool = allLinesForTool.concat(segsForTool[si].lines);
            }

            for (var posIndex = 0; posIndex < positions.length; posIndex++) {
              var pos = positions[posIndex];
              var isLast = posIndex === positions.length - 1;

              output.push('(T' + toolNum + ' Part ' + pos.partNum + ' - Row ' + pos.row + ', Col ' + pos.col + ')');
              output.push('(Offset: X=' + pos.offsetX.toFixed(3) + ', Y=' + pos.offsetY.toFixed(3) + ')');

              processLinesWithCommentRepositioning(
                allLinesForTool,
                createOffsetFn(pos.offsetX, pos.offsetY, pos.rotDeg),
                !isLast,
                output
              );
              output.push('');
            }
          }
        }
      } else {
        var segments = parseToolSegments(originalGcode);
        var headerSegment = segments.find(function(s) { return s.isHeader; });
        var toolSegments = segments.filter(function(s) { return !s.isHeader; });

        if (toolSegments.length === 0) {
          var sourceLines = headerSegment ? headerSegment.lines : originalGcode.split('\n');
          var preamble = [];
          var cutting = [];
          var postamble = [];
          var phase = 'preamble';

          for (var li = 0; li < sourceLines.length; li++) {
            var line = sourceLines[li];
            var trimmed = line.trim().toUpperCase();

            if (/\bM0*30\b/.test(trimmed) || /\bM0*2\b/.test(trimmed)) continue;

            if (phase === 'preamble') {
              var isSpindleStart = /\bM0*[34]\b/.test(trimmed);
              var hasXY = /[XY][+-]?\d/.test(trimmed) && !/G53/.test(trimmed);
              if (isSpindleStart || hasXY) {
                phase = 'cutting';
              }
            }

            if (phase === 'cutting') {
              var isG53 = /G53/.test(trimmed);
              var isStop = isSpindleStopCommand(line);
              if (isG53 || isStop) {
                phase = 'postamble';
              }
            }

            if (phase === 'preamble') {
              preamble.push(line);
            } else if (phase === 'cutting') {
              cutting.push(line);
            } else {
              postamble.push(line);
            }
          }

          for (var i = 0; i < preamble.length; i++) {
            output.push(preamble[i]);
          }
          output.push('');

          for (var posIndex = 0; posIndex < positions.length; posIndex++) {
            var pos = positions[posIndex];
            var isLast = posIndex === positions.length - 1;

            output.push('(Part ' + pos.partNum + ' of ' + totalParts + ' - Row ' + pos.row + ', Col ' + pos.col + ')');
            output.push('(Offset: X=' + pos.offsetX.toFixed(3) + ', Y=' + pos.offsetY.toFixed(3) + ')');

            var offsetFn = createOffsetFn(pos.offsetX, pos.offsetY, pos.rotDeg);
            for (var ci = 0; ci < cutting.length; ci++) {
              if (!isLast && isSpindleStopCommand(cutting[ci])) {
                continue;
              }
              output.push(offsetFn(cutting[ci]));
            }
            output.push('');
          }

          for (var i = 0; i < postamble.length; i++) {
            output.push(postamble[i]);
          }
        } else {
          output.push('(Standard replication - all tools per part in original order)');
          output.push('(Tool changes per part: ' + toolSegments.length + ')');
          output.push('');

          if (headerSegment && headerSegment.lines.length > 0) {
            for (var i = 0; i < headerSegment.lines.length; i++) {
              output.push(headerSegment.lines[i]);
            }
            output.push('');
          }

          for (var posIndex = 0; posIndex < positions.length; posIndex++) {
            var pos = positions[posIndex];
            var isLastPosition = posIndex === positions.length - 1;

            output.push('(Part ' + pos.partNum + ' of ' + totalParts + ' - Row ' + pos.row + ', Col ' + pos.col + ')');
            output.push('(Offset: X=' + pos.offsetX.toFixed(3) + ', Y=' + pos.offsetY.toFixed(3) + ')');
            output.push('');

            for (var segIndex = 0; segIndex < toolSegments.length; segIndex++) {
              var seg = toolSegments[segIndex];
              var isLastSegment = segIndex === toolSegments.length - 1;

              output.push('T' + seg.toolNum + ' M6');

              processLinesWithCommentRepositioning(
                seg.lines,
                createOffsetFn(pos.offsetX, pos.offsetY, pos.rotDeg),
                !(isLastPosition && isLastSegment),
                output
              );
              output.push('');
            }
          }
        }
      }

      output.push('M30 (Program end)');

      return output.join('\n');
    }

    // ---- Event listeners ----

    Array.prototype.forEach.call(document.querySelectorAll('.rep-nav-btn'), function(btn) {
      btn.addEventListener('click', function() {
        var target = btn.getAttribute('data-nav');
        Array.prototype.forEach.call(document.querySelectorAll('.rep-nav-btn'), function(b) {
          b.classList.toggle('active', b === btn);
        });
        Array.prototype.forEach.call(document.querySelectorAll('.rep-pattern'), function(panel) {
          panel.classList.toggle('active', panel.getAttribute('data-view') === target);
        });
        // A different pattern means a different part count, so the skip list
        // stops meaning what it did.
        document.getElementById('skipInstances').value = '';
        setTimeout(function() { sliderRefreshers.forEach(function(f) { f(); }); }, 0);
        updatePreview();
        scheduleSave();
      });
    });

    var sortEl = document.getElementById('sortByTool');
    if (sortEl) sortEl.addEventListener('change', scheduleSave);

    var resetEl = document.getElementById('resetToOriginal');
    if (resetEl) {
      resetEl.addEventListener('change', function() {
        resetToOriginal = resetEl.checked;
        useSource();
        document.getElementById('rep-source-name').textContent = baseName(sourceName);
        document.getElementById('rep-part-size').textContent = partSizeText();
        updatePreview();
        scheduleSave();
      });
    }

    ['rows', 'columns', 'gapX', 'gapY', 'skipInstances',
     'hcRows', 'hcColumns', 'hcGapX', 'hcGapY', 'trimEnds',
     'circCount', 'circRadius', 'circStartAngle', 'circStyle'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', updatePreview);
        el.addEventListener('change', updatePreview);
        // Save when the operator is done with a field - it loses focus with a new
        // value - not on every keystroke. The preview above still follows typing.
        el.addEventListener('change', scheduleSave);
      }
    });

    ['rows', 'columns', 'hcRows', 'hcColumns', 'circCount'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('change', function() {
          document.getElementById('skipInstances').value = '';
          updatePreview();
        });
      }
    });

    var skipInstancesInput = document.getElementById('skipInstances');
    if (skipInstancesInput) {
      skipInstancesInput.addEventListener('keypress', function(e) {
        var allowedChars = /[0-9,\- ]/;
        if (!allowedChars.test(e.key) && e.key !== 'Backspace' && e.key !== 'Delete' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') {
          e.preventDefault();
        }
      });
      skipInstancesInput.addEventListener('paste', function(e) {
        e.preventDefault();
        var pastedText = (e.clipboardData || window.clipboardData).getData('text');
        var filteredText = pastedText.replace(/[^0-9,\- ]/g, '');
        document.execCommand('insertText', false, filteredText);
      });
    }

    // ---- Persistence ----

    /** Everything the dialog remembers, read from every tab's own fields. */
    function collectSettings() {
      var dir = function(id) {
        var el = document.getElementById(id);
        return el && el.dataset.value ? el.dataset.value : 'positive';
      };
      var mode = function(id) {
        var el = document.getElementById(id);
        return el && el.dataset.value === 'distance' ? 'distance' : 'gap';
      };
      return {
        pattern: activePattern(),
        rows: numValue('rows', 1),
        columns: numValue('columns', 1),
        rowDirection: dir('rowDirection'),
        columnDirection: dir('columnDirection'),
        gapX: convertToMetric(numValue('gapX', 0)),
        gapY: convertToMetric(numValue('gapY', 0)),
        spacingMode: mode('spacingMode'),
        hcRows: numValue('hcRows', 3),
        hcColumns: numValue('hcColumns', 3),
        hcGapX: convertToMetric(numValue('hcGapX', 0)),
        hcGapY: convertToMetric(numValue('hcGapY', 0)),
        hcSpacingMode: mode('hcSpacingMode'),
        trimEnds: document.getElementById('trimEnds').checked,
        circCount: numValue('circCount', 6),
        circRadius: convertToMetric(numValue('circRadius', 0)),
        circStartAngle: numValue('circStartAngle', 0),
        circStyle: document.getElementById('circStyle').value,
        sortByTool: document.getElementById('sortByTool').checked,
        skipInstances: document.getElementById('skipInstances').value.trim(),
        resetToOriginal: resetToOriginal
      };
    }

    // Saved as the operator works rather than only on Generate, which lost every
    // change made before closing the dialog. Debounced so typing a number sends
    // one save, not one per keystroke.
    var saveTimer = null;
    function saveSettingsNow() {
      clearTimeout(saveTimer);
      saveTimer = null;
      fetch(BASE_URL + '/api/plugins/com.ncsender.replicator/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ replicator: collectSettings() })
      }).catch(function(err) { console.error('Failed to save settings:', err); });
    }
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveSettingsNow, 400);
    }

    // Initialize slider toggles
    var initSliderToggle = function(toggleId, onChange) {
      var toggle = document.getElementById(toggleId);
      if (!toggle) return;

      var options = toggle.querySelectorAll('.slider-option');
      var indicator = toggle.querySelector('.slider-indicator');

      var updateIndicator = function(activeOption) {
        indicator.style.left = activeOption.offsetLeft + 'px';
        indicator.style.width = activeOption.getBoundingClientRect().width + 'px';
      };

      options.forEach(function(option) {
        option.addEventListener('click', function() {
          var previous = toggle.dataset.value;
          options.forEach(function(opt) { opt.classList.remove('active'); });
          option.classList.add('active');
          toggle.dataset.value = option.dataset.value;
          updateIndicator(option);
          if (onChange && previous !== option.dataset.value) onChange(option.dataset.value);
          updatePreview();
          scheduleSave();
        });
      });

      var refresh = function() {
        var current = toggle.querySelector('.slider-option.active');
        if (current && toggle.offsetParent !== null) updateIndicator(current);
      };
      sliderRefreshers.push(refresh);
      setTimeout(refresh, 0);
    };

    // Flipping Gap and Distance converts the numbers too, so the pattern stays
    // exactly where it was and only the way it is described changes.
    function convertSpacing(xId, yId, next) {
      var sign = next === 'distance' ? 1 : -1;
      document.getElementById(xId).value = formatLength(numValue(xId, 0) + sign * convertToDisplay(partWidth));
      document.getElementById(yId).value = formatLength(numValue(yId, 0) + sign * convertToDisplay(partHeight));
      document.getElementById(xId + '-label').textContent = 'X ' + spacingWord(next) + ' (' + distanceUnit + ')';
      document.getElementById(yId + '-label').textContent = 'Y ' + spacingWord(next) + ' (' + distanceUnit + ')';
    }

    initSliderToggle('columnDirection');
    initSliderToggle('rowDirection');
    initSliderToggle('spacingMode', function(next) { convertSpacing('gapX', 'gapY', next); });
    initSliderToggle('hcSpacingMode', function(next) { convertSpacing('hcGapX', 'hcGapY', next); });

    // Initial preview
    updatePreview();

    // Form submission
    document.getElementById('replicatorForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      var patternInputs = readPatternInputs();
      var sortByTool = document.getElementById('sortByTool').checked;
      var skipInstancesVal = document.getElementById('skipInstances').value.trim();
      var outputFilename = getOutputFilename();

      var rows = patternInputs.rows || 1;
      var columns = patternInputs.columns || 1;
      var rowDirection = patternInputs.rowDirection || 'positive';
      var columnDirection = patternInputs.columnDirection || 'positive';
      var spacingXMm = patternInputs.spacingX || 0;
      var spacingYMm = patternInputs.spacingY || 0;
      var gapXMm = spacingXMm ? spacingXMm - partWidth : 0;
      var gapYMm = spacingYMm ? spacingYMm - partHeight : 0;

      var patternStyle = patternInputs.style;
      var patternLabel = patternInputs.label;
      var trimEnds = !!patternInputs.trimEnds;
      var circularCount = patternInputs.count;
      var circularRadius = patternInputs.radius;
      var circularStartAngle = patternInputs.startAngle;
      var patternCount = computePatternExtent(patternInputs, partWidth, partHeight).count;

      saveSettingsNow();

      // Generate the replicated G-code
      var replicatedGcode = generateReplicatedGCode(gcodeContent, {
        rows: rows,
        columns: columns,
        rowDirection: rowDirection,
        columnDirection: columnDirection,
        spacingX: spacingXMm,
        spacingY: spacingYMm,
        gapX: gapXMm,
        gapY: gapYMm,
        sortByTool: sortByTool,
        skipInstances: skipInstancesVal,
        originalFilename: originalSourceFile,
        patternStyle: patternStyle,
        patternLabel: patternLabel,
        totalParts: patternCount,
        trimEnds: trimEnds,
        count: circularCount,
        radius: circularRadius,
        startAngle: circularStartAngle
      });

      // Load the generated G-code temporarily
      try {
        var response = await fetch(BASE_URL + '/api/gcode-files/load-temp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            content: replicatedGcode,
            filename: outputFilename,
            sourceFile: originalSourceFile
          })
        });

        if (response.ok) {
          console.log('Replicated G-code generated and loaded:', outputFilename);
          setTimeout(function() {
            window.postMessage({ type: 'close-plugin-dialog' }, '*');
          }, 100);
        } else {
          alert('Failed to load G-code');
        }
      } catch (error) {
        console.error('Error loading replicated G-code:', error);
        alert('Error loading G-code');
      }
    });
  }

  // ---- Initialization: fetch all required data via API ----

  async function init() {
    try {
      // Fetch server state, firmware, and settings in parallel
      var results = await Promise.all([
        fetch(BASE_URL + '/api/server-state'),
        fetch(BASE_URL + '/api/firmware'),
        fetch(BASE_URL + '/api/settings')
      ]);

      var serverState = await results[0].json();
      var firmware = await results[1].json();
      var appSettings = await results[2].json();

      // Check if a file is loaded
      var jobLoaded = serverState.jobLoaded;
      var filename = jobLoaded ? jobLoaded.filename : null;

      if (!filename) {
        showNoFile();
        return;
      }

      var originalSourceFile = (jobLoaded && jobLoaded.sourceFile) || filename;

      // Fetch the current gcode content
      var gcodeResponse = await fetch(BASE_URL + '/api/gcode-files/current/download');
      if (!gcodeResponse.ok) {
        showNoFile();
        return;
      }
      var gcodeContent = await gcodeResponse.text();

      // A file Replicator or Rotate produced remembers the stored file it came
      // from; fetch that too, so a pattern can be rebuilt from the original.
      var originalContent = null;
      if (jobLoaded.isTemporary && jobLoaded.sourceFile) {
        try {
          var originalResponse = await fetch(BASE_URL + '/api/gcode-files/file?path=' + encodeURIComponent(jobLoaded.sourceFile));
          if (originalResponse.ok) {
            var originalJson = await originalResponse.json();
            var text = originalJson && (originalJson.content != null ? originalJson.content : originalJson.Content);
            if (typeof text === 'string') originalContent = text;
          }
        } catch (e) {
          originalContent = null;
        }
      }

      // Get machine limits from firmware settings
      var machineLimits = { x: 400, y: 400 };
      try {
        var xMax = parseFloat(firmware.settings && firmware.settings['130'] && firmware.settings['130'].value);
        var yMax = parseFloat(firmware.settings && firmware.settings['131'] && firmware.settings['131'].value);
        if (!isNaN(xMax) && xMax > 0) machineLimits.x = xMax;
        if (!isNaN(yMax) && yMax > 0) machineLimits.y = yMax;
      } catch (e) {
        console.warn('Failed to parse firmware settings, using defaults');
      }

      // Analyze G-code bounds
      var bounds = analyzeGCodeBounds(gcodeContent);
      // Bounds come back in the file's own units; the rest of the plugin works in mm.
      var fileInches = detectFileInches(gcodeContent);
      if (fileInches) {
        ['min', 'max'].forEach(function(k) {
          bounds[k].x *= 25.4;
          bounds[k].y *= 25.4;
          bounds[k].z *= 25.4;
        });
      }

      // Units
      var unitsPreference = appSettings.unitsPreference || 'metric';
      var isImperial = unitsPreference === 'imperial';
      var distanceUnit = isImperial ? 'in' : 'mm';

      var MM_TO_INCH = 0.0393701;
      var convertToDisplay = function(value) {
        return isImperial ? parseFloat((value * MM_TO_INCH).toFixed(3)) : value;
      };

      var partWidth = bounds.max.x - bounds.min.x;
      var partHeight = bounds.max.y - bounds.min.y;

      // Get saved settings from initialConfig (passed via template variable)
      var savedSettings = (initialConfig && initialConfig.replicator) || {};

      var settings = {
        rows: savedSettings.rows != null ? savedSettings.rows : 1,
        rowDirection: savedSettings.rowDirection || 'positive',
        columns: savedSettings.columns != null ? savedSettings.columns : 2,
        columnDirection: savedSettings.columnDirection || 'positive',
        gapX: convertToDisplay(savedSettings.gapX != null ? savedSettings.gapX : 5),
        gapY: convertToDisplay(savedSettings.gapY != null ? savedSettings.gapY : 5),
        sortByTool: savedSettings.sortByTool != null ? savedSettings.sortByTool : false,
        skipInstances: savedSettings.skipInstances || '',
        pattern: savedSettings.pattern || 'grid',
        hcRows: savedSettings.hcRows != null ? savedSettings.hcRows : 3,
        hcColumns: savedSettings.hcColumns != null ? savedSettings.hcColumns : 3,
        hcGapX: convertToDisplay(savedSettings.hcGapX != null ? savedSettings.hcGapX : 5),
        hcGapY: convertToDisplay(savedSettings.hcGapY != null ? savedSettings.hcGapY : 5),
        trimEnds: savedSettings.trimEnds != null ? savedSettings.trimEnds : true,
        circCount: savedSettings.circCount != null ? savedSettings.circCount : 6,
        circRadius: convertToDisplay(savedSettings.circRadius != null ? savedSettings.circRadius : 100),
        circStartAngle: savedSettings.circStartAngle != null ? savedSettings.circStartAngle : 0,
        circStyle: savedSettings.circStyle || 'circular',
        spacingMode: savedSettings.spacingMode === 'distance' ? 'distance' : 'gap',
        hcSpacingMode: savedSettings.hcSpacingMode === 'distance' ? 'distance' : 'gap',
        resetToOriginal: savedSettings.resetToOriginal != null ? savedSettings.resetToOriginal : true
      };

      showReplicatorForm({
        fileInches: fileInches,
        originalContent: originalContent,
        filename: filename,
        originalSourceFile: originalSourceFile,
        gcodeContent: gcodeContent,
        bounds: bounds,
        machineLimits: machineLimits,
        settings: settings,
        isImperial: isImperial,
        distanceUnit: distanceUnit,
        partWidth: partWidth,
        partHeight: partHeight
      });

    } catch (error) {
      console.error('Replicator init error:', error);
      showError('Failed to load data. Please try again.');
    }
  }

  init();
})();
</script>
